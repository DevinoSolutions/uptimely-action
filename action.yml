name: "Uptimely Monitors"
description: "Mute Uptimely monitors during a deploy, create a monitor per preview URL, and gate a job on a monitor being up."
author: "Devino Solutions"
branding:
  icon: "activity"
  color: "green"

inputs:
  operation:
    description: "What to do: mute, unmute, create-preview-monitor, delete-monitor or check."
    required: true
  api-key:
    description: "Uptimely project API key (uptimely_live_...). Store it as a repository secret."
    required: true
  api-url:
    description: "Uptimely API base URL."
    required: false
    default: "https://app.getuptimely.com"
  fail-on-error:
    description: "Set to 'false' to report an error as a warning and keep the step green, e.g. for an if: always() unmute after a successful deploy."
    required: false
    default: "true"

  # mute / unmute
  monitor-ids:
    description: "mute/unmute: monitor ids, comma- or newline-separated."
    required: false
  labels:
    description: "mute/unmute: label names; every monitor carrying one of them is selected. Combined with monitor-ids."
    required: false
  mute-minutes:
    description: "mute: how long alerts stay muted (1-43200). The mute expires on its own even if unmute never runs."
    required: false
    default: "30"

  # create-preview-monitor / delete-monitor / check
  url:
    description: "create-preview-monitor: the preview URL to monitor."
    required: false
  name:
    description: "Monitor name. create-preview-monitor reuses, and delete-monitor deletes, only monitors with this name that carry the action's ownership marker for this repo and PR; check looks the monitor up by name. Defaults to '<owner>/<repo> PR #<n> preview' on pull_request events."
    required: false
  monitor-type:
    description: "create-preview-monitor: Website or API. delete-monitor: optional type filter for name lookups."
    required: false
  description:
    description: "create-preview-monitor: monitor description. The ownership marker '[uptimely-action:<owner>/<repo>#<pr>]' is always appended."
    required: false
  monitoring-interval:
    description: "create-preview-monitor: cron-shaped check cadence, e.g. '*/5 * * * *' (Uptimely default)."
    required: false
  failure-threshold:
    description: "create-preview-monitor: consecutive failed checks before an incident (1-10, Uptimely default 2)."
    required: false
  monitor-id:
    description: "delete-monitor / check: the monitor id (takes precedence over name)."
    required: false

  # check
  timeout-seconds:
    description: "check: fail if the monitor is not up within this many seconds."
    required: false
    default: "900"
  interval-seconds:
    description: "check: seconds between polls (min 5). Each poll is one request from the project's monthly API allowance."
    required: false
    default: "15"
  up-statuses:
    description: "check: status names that count as up, comma-separated."
    required: false
    default: "Operational"
  stable-for-seconds:
    description: "check: the monitor must stay up this long (after a new check, see wait-for-new-check) before the check passes."
    required: false
    default: "0"
  wait-for-new-check:
    description: "check: only trust a status that Uptimely recorded after this step started (a new monitor reads Operational before its first check; a re-pointed one keeps its old URL's status). timeout-seconds should then be at least twice the monitor's check interval. Set 'false' for monitor types no probe checks."
    required: false
    default: "true"

outputs:
  monitor-id:
    description: "create-preview-monitor / check: the monitor id. delete-monitor: the first id deleted."
  monitor-ids:
    description: "mute / unmute / delete-monitor: comma-separated ids of the monitors that were muted / unmuted / deleted."
  monitor-name:
    description: "create-preview-monitor: the monitor name used."
  created:
    description: "create-preview-monitor: 'true' if a monitor was created, 'false' if an existing one was reused."
  updated:
    description: "create-preview-monitor: 'true' if a reused monitor's URL was updated to the new preview URL."
  deleted:
    description: "delete-monitor: 'true' if a monitor was deleted, 'false' if there was nothing to delete."
  muted-until:
    description: "mute: when the mute window ends (ISO-8601 UTC)."
  status:
    description: "check: the monitor's last observed status name."

runs:
  using: "node24"
  main: "dist/index.js"
